<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - PanenHub</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      opacity: 0.6;
    }
    h1 {
      color: #1f2937;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
    }
    p {
      color: #6b7280;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .button {
      background: #2E7D32;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .button:hover {
      background: #1b5e20;
    }
    .offline-indicator {
      display: inline-flex;
      align-items: center;
      background: #fef2f2;
      color: #dc2626;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #dc2626;
      border-radius: 50%;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-12.728 12.728m0-12.728l12.728 12.728M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"/>
    </svg>
    
    <div class="offline-indicator">
      <div class="status-dot"></div>
      Tidak ada koneksi internet
    </div>
    
    <h1>Anda sedang offline</h1>
    <p>
      Sepertinya koneksi internet Anda bermasalah. 
      Periksa koneksi Anda dan coba lagi.
    </p>
    
    <button class="button" onclick="window.location.reload()">
      Coba Lagi
    </button>
    
    <script>
      // Auto-refresh when back online
      window.addEventListener('online', () => {
        window.location.reload();
      });
      
      // Show online/offline status
      function updateStatus() {
        const indicator = document.querySelector('.offline-indicator');
        const dot = document.querySelector('.status-dot');
        
        if (navigator.onLine) {
          indicator.style.background = '#f0f9ff';
          indicator.style.color = '#0284c7';
          dot.style.background = '#0284c7';
          indicator.innerHTML = '<div class="status-dot"></div>Terhubung kembali';
          setTimeout(() => window.location.reload(), 1000);
        }
      }
      
      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
    </script>
  </div>
</body>
</html>
